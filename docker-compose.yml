# ============================================================
# Learing Web - Docker Compose
# ============================================================
# ASP.NET Web Forms (Windows container) + SQL Server Express
# (Windows container — both services must run on Windows containers)
#
# IMPORTANT: Docker Desktop must be in Windows containers mode.
#
# Usage:
#   docker compose up -d          # Start everything
#   docker compose down           # Stop and remove
#   docker compose logs -f        # View logs
#   docker compose down -v        # Remove volumes too (wipe DB)
# ============================================================

version: "3.8"

services:
  # ---- ASP.NET Web Application (Windows container) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-web
    ports:
      - "8080:80"
    environment:
      # Connection string pointing to the SQL Server container
      - ConnectionString=Data Source=sqlserver;Initial Catalog=Learningweb;User Id=sa;Password=YourStrong@Passw0rd1;
    depends_on:
      - sqlserver
    restart: unless-stopped

  # ---- SQL Server Express (Windows container) ----
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: learning-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd1
      - MSSQL_PID=Developer
    volumes:
      - sql-data:C:/var/opt/mssql
    restart: unless-stopped

volumes:
  sql-data:
