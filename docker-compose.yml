version: "3.8"

services:
  # ---- ASP.NET Core Web App (Linux container) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-web
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - CONNECTION_STRING=Server=sqlserver,1433;Database=Learningweb;User Id=sa;Password=YourStrong@Passw0rd1;TrustServerCertificate=True;
    depends_on:
      - sqlserver
    restart: unless-stopped

  # ---- SQL Server (Linux container) ----
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: learning-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd1
      - MSSQL_PID=Developer
    volumes:
      - sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sql-data:
